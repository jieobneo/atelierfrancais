
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ATELIER FRANÇAIS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #F5F1E9;
    color: #443B33;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 55px 40px;
}

/* MAIN TITLE */

header {
    text-align: center;
    margin-bottom: 65px;
}

.logo {
    font-family: 'Playfair Display', serif;
    font-size: clamp(65px, 10vw, 120px);
    font-weight: 700;
    color: #574436;
    letter-spacing: 2px;
    line-height: 1.2;
}

/* EXERCISE */

.exercise-section {
    max-width: 900px;
    margin: auto;
}

.exercise-card {
    background: #FBF9F4;
    border: 1px solid #E5DDD1;
    border-radius: 5px;
    padding: 35px 38px;
    min-height: 200px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all 0.3s ease;
}

.exercise-card:hover {
    border-color: #B8A38C;
    transform: translateY(-3px);
}

/* CATEGORY LABELS */

.labels {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
}

.label {
    display: inline-block;
    padding: 7px 13px;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
}

.grammar {
    background: #285D54;
    color: #FFFFFF;
}

.level {
    background: #DCE8E3;
    color: #285D54;
}

/* EXERCISE TITLE */

.exercise-title {
    font-family: 'Playfair Display', serif;
    font-size: 48px;
    font-weight: 600;
    color: #493D33;
    line-height: 1.3;
    margin-bottom: 12px;
}

.description {
    font-size: 19px;
    color: #766B60;
    line-height: 1.8;
}

/* ARROW */

.arrow {
    color: #A8795B;
    font-size: 65px;
    margin-left: 25px;
    flex-shrink: 0;
}

/* FOOTER */

footer {
    text-align: center;
    margin-top: 80px;
    font-family: 'Playfair Display', serif;
    font-size: 12px;
    color: #A99B8B;
    letter-spacing: 2px;
}

/* MOBILE */

@media (max-width: 600px) {
    .container {
        padding: 35px 18px;
    }

    header {
        margin-bottom: 40px;
    }

    .logo {
        font-size: 43px;
        letter-spacing: 0;
    }

    .exercise-card {
        padding: 25px 18px;
        min-height: 170px;
    }

    .label {
        font-size: 11px;
    }

    .exercise-title {
        font-size: 28px;
    }

    .description {
        font-size: 15px;
    }

    .arrow {
        font-size: 42px;
        margin-left: 10px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1 class="logo">ATELIER FRANÇAIS</h1>
</header>

<main class="exercise-section">

    <article class="exercise-card">

        <div class="exercise-content">

            <div class="labels">
                <span class="label grammar">GRAMMAIRE</span>
                <span class="label level">A2</span>
            </div>

            <h2 class="exercise-title">
                Passé composé ou imparfait ?
            </h2>

            <p class="description">
                Choisissez le temps qui convient.
            </p>

        </div>

        <div class="arrow">→</div>

    </article>

</main>

<footer>
    ATELIER FRANÇAIS
</footer>

</div>

</body>
</html>
