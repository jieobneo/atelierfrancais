
<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>atelier</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Pacifico&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>

/* RESET */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

/* BACKGROUND */

body {
    background-color: #F5F1E9;
    color: #443B33;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
}

/* MAIN CONTAINER */

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 35px 40px;
}

/* TITLE */

header {
    text-align: center;
    margin-bottom: 35px;
}

.logo {
    font-family: 'Pacifico', cursive;
    font-size: clamp(280px, 45vw, 600px);
    font-weight: 400;
    color: #574436;
    line-height: 1.2;
    letter-spacing: -8px;
}

/* EXERCISE SECTION */

.exercise-section {
    max-width: 900px;
    margin: 0 auto;
}

/* EXERCISE CARD */

.exercise-card {
    background: #FBF9F4;
    border: 1px solid #E5DDD1;
    border-radius: 5px;
    padding: 35px 38px;
    min-height: 200px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    transition: all 0.3s ease;
}

.exercise-card:hover {
    border-color: #B8A38C;
    transform: translateY(-3px);
}

/* EXERCISE NUMBER */

.number {
    font-family: 'Playfair Display', serif;
    color: #A38D77;
    font-size: 18px;
    letter-spacing: 2px;
    margin-bottom: 18px;
}

/* EXERCISE TITLE */

.exercise-title {
    font-family: 'Playfair Display', serif;
    font-size: 60px;
    font-weight: 600;
    color: #493D33;
    line-height: 1.3;
    margin-bottom: 12px;
}

/* DESCRIPTION */

.description {
    font-size: 19px;
    color: #8C8073;
    line-height: 1.8;
}

/* ARROW */

.arrow {
    color: #A8795B;
    font-size: 65px;
    margin-left: 25px;
    flex-shrink: 0;
}

/* FOOTER */

footer {
    text-align: center;
    margin-top: 80px;
    font-family: 'Playfair Display', serif;
    font-size: 12px;
    color: #A99B8B;
    letter-spacing: 1px;
}

/* MOBILE */

@media (max-width: 600px) {

    .container {
        padding: 30px 18px;
    }

    header {
        margin-bottom: 30px;
    }

    .logo {
        font-size: 150px;
        letter-spacing: -4px;
    }

    .exercise-card {
        padding: 25px 20px;
        min-height: 170px;
    }

    .number {
        font-size: 13px;
    }

    .exercise-title {
        font-size: 30px;
    }

    .description {
        font-size: 15px;
    }

    .arrow {
        font-size: 42px;
        margin-left: 12px;
    }

}

</style>
</head>

<body>

<div class="container">

    <header>
        <h1 class="logo">atelier</h1>
    </header>

    <main class="exercise-section">

        <article class="exercise-card">

            <div class="exercise-content">

                <p class="number">
                    01 — GRAMMAIRE · A2
                </p>

                <h2 class="exercise-title">
                    Passé composé ou imparfait ?
                </h2>

                <p class="description">
                    Choisissez le temps qui convient.
                </p>

            </div>

            <div class="arrow">→</div>

        </article>

    </main>

    <footer>
        ATELIER
    </footer>

</div>

</body>
</html>
